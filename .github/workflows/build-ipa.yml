name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "apps.json"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web App and Generate Assets
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          npm install
          npm run build

          # Add Capacitor iOS
          npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/assets
          npx cap add ios

          # Add required privacy usage descriptions. Without these, iOS hard-crashes
          # the app the instant it touches camera/photo-library APIs (used by the
          # barcode scanner and AI food scanner) — Capacitor's default Info.plist
          # template doesn't include them.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'MacroPulse needs camera access to scan barcodes and recognize meals for calorie tracking.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'MacroPulse needs photo library access so you can select meal photos for AI food recognition.'" "$PLIST"

          # Auto-generate iOS app icons from icon.png if present
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            npx @capacitor/assets generate --ios
          fi

          npx cap sync ios

      - name: Compile Xcode Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r MacroPulse.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroPulse-Unsigned-IPA
          path: build/MacroPulse.ipa

      - name: Publish GitHub Release (for apps.json downloadURL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/MacroPulse.ipa \
            --title "MacroPulse (latest unsigned build)" \
            --notes "Automated unsigned build from commit ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
